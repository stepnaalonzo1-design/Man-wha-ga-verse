<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena</title>
  <link rel="stylesheet" href="style.css">

<body>

  <header class="header">
    <a href="#" class="logo">ARENA</a>

    <nav>
      <a href="#home">Home</a>
      <a href="#library">Library</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-content">
        <p class="eyebrow">YOUR MANHWA LIBRARY</p>
        <h1>Enter the world of stories.</h1>
        <p>Discover and read your favorite manhwa on Arena.</p>
        <a href="#library" class="hero-button">Explore Library</a>
      </div>
    </section>

    <section class="library-section" id="library">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR NEXT READ</p>
          <h2>Manhwa Library</h2>
        </div>

        <input
          type="search"
          id="searchInput"
          placeholder="Search manhwa..."
          aria-label="Search manhwa"
        >
      </div>

      <div id="library" class="library-grid"></div>
    </section>

    <section id="reader" class="reader" hidden>
      <div class="reader-header">
        <button id="exitReader" type="button">← Back to Library</button>
        <h2 id="readerTitle">Reading</h2>
      </div>

      <div id="readerPages" class="reader-pages"></div>
    </section>
  </main>

  <footer>
    <p>ARENA · Read your next story</p>
  </footer>

    const library = document.getElementById("library");
    const reader = document.getElementById("reader");
    const readerTitle = document.getElementById("readerTitle");
    const readerPages = document.getElementById("readerPages");
    const searchInput = document.getElementById("searchInput");

    function renderLibrary() {
      const search = searchInput.value.toLowerCase();

      const filtered = comics.filter(comic =>
        comic.title.toLowerCase().includes(search) ||
        comic.genre.toLowerCase().includes(search)
      );

      library.innerHTML = filtered.map(comic => `
        <article class="comic-card">
          <button class="comic-cover" type="button" data-id="${comic.id}">
            <img src="${comic.cover}" alt="${comic.title} cover">
            <span class="cover-overlay">Read Now</span>
          </button>
          <div class="comic-info">
            <h3>${comic.title}</h3>
            <p>${comic.genre} · ${comic.chapter}</p>
          </div>
        </article>
      `).join("");

      library.querySelectorAll("[data-id]").forEach(button => {
        button.addEventListener("click", () => openComic(Number(button.dataset.id)));
      });
    }

    function openComic(id) {
      const comic = comics.find(item => item.id === id);
      if (!comic) return;

      readerTitle.textContent = comic.title + " — " + comic.chapter;
      readerPages.innerHTML = comic.pages.map((page, index) => `
        <img
          src="${page}"
          alt="${comic.title}, page ${index + 1}"
          loading="${index < 2 ? "eager" : "lazy"}"
        >
      `).join("");

      reader.hidden = false;
      document.getElementById("home").hidden = true;
      document.querySelector(".library-section").hidden = true;
      window.scrollTo(0, 0);
    }

    document.getElementById("exitReader").addEventListener("click", () => {
      reader.hidden = true;
      document.getElementById("home").hidden = false;
      document.querySelector(".library-section").hidden = false;
      window.scrollTo(0, 0);
    });

    searchInput.addEventListener("input", renderLibrary);

    renderLibrary();
  </script>
